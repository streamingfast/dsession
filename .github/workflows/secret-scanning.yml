name: Secret Scanning Check
on:
  pull_request:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      # Skip for forks (no secret access) and for dependabot PRs: dependabot runs
      # are same-repo so the fork check passes, but they get no access to repo
      # secrets, leaving SECRETS_ALERTS empty and failing the action.
      - name: Run Secret Scanning Review
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        uses: advanced-security/secret-scanning-review-action@v2.2.8
        with:
          token: ${{ secrets.SECRETS_ALERTS }}
          fail-on-alert: true # This turns it into a hard status check
          runtime: python
